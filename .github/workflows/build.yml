name: Verify Carl Crayon Preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify image assets
        run: |
          for img in carl-hero carl-youtube carl-legday carl-shoulders carl-back carl-chest carl-lifestyle; do
            test -s "public/images/$img.jpg" || { echo "::error::Missing $img.jpg"; exit 1; }
          done
      - name: Production build
        run: npm run build
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run mobile smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/carl-crayon/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/mobile-smoke.mjs
      - name: Upload mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-smoke-screenshots
          path: |
            mobile-smoke.png
            desktop-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: carl-crayon-dist
          path: dist/
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
