name: Verify Carl Crayon Preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify image assets
        run: |
          for img in carl-hero carl-youtube carl-legday carl-shoulders carl-back carl-chest carl-lifestyle; do
            test -s "public/images/$img.jpg" || { echo "::error::Missing $img.jpg"; exit 1; }
          done
      - name: Production build
        run: npm run build
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: carl-crayon-dist
          path: dist/
          retention-days: 7
